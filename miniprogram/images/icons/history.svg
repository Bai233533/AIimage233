<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- 时钟外圈 -->
  <circle cx="12" cy="12" r="9" fill="#F8F6F4" stroke="#8B7355" stroke-width="1.5"/>
  
  <!-- 时钟内圈 -->
  <circle cx="12" cy="12" r="7" fill="none" stroke="#A08060" stroke-width="1"/>
  
  <!-- 时针 -->
  <line x1="12" y1="12" x2="12" y2="7" stroke="#8B7355" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- 分针 -->
  <line x1="12" y1="12" x2="16" y2="12" stroke="#8B7355" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- 中心点 -->
  <circle cx="12" cy="12" r="1" fill="#8B7355"/>
</svg>