<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- 图片外框 -->
  <rect x="8" y="8" width="32" height="32" rx="4" fill="url(#gradient)" stroke="#8B7355" stroke-width="2"/>
  
  <!-- 山峰 -->
  <path d="M12 36L24 16L36 36" fill="url(#gradient)" stroke="#8B7355" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- 太阳 -->
  <circle cx="32" cy="12" r="4" fill="url(#gradient)" stroke="#8B7355" stroke-width="1.5"/>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7355"/>
      <stop offset="100%" stop-color="#F8F6F4"/>
    </linearGradient>
  </defs>
</svg>