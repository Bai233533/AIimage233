<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- 圆形背景 -->
  <circle cx="24" cy="24" r="16" fill="url(#gradient)" stroke="#8B7355" stroke-width="2"/>
  
  <!-- 加号 -->
  <line x1="24" y1="16" x2="24" y2="32" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="24" x2="32" y2="24" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7355"/>
      <stop offset="100%" stop-color="#F8F6F4"/>
    </linearGradient>
  </defs>
</svg>