<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- 时钟外圈 -->
  <circle cx="12" cy="12" r="9" fill="#1E3A8A" stroke="#1E3A8A" stroke-width="1.5"/>
  
  <!-- 时钟内圈 -->
  <circle cx="12" cy="12" r="7" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.8"/>
  
  <!-- 时针 -->
  <line x1="12" y1="12" x2="12" y2="7" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- 分针 -->
  <line x1="12" y1="12" x2="16" y2="12" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- 中心点 -->
  <circle cx="12" cy="12" r="1" fill="#FFFFFF"/>
</svg>