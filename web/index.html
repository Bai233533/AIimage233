<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>AI漫剧大师</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 桌面端侧边栏（移动端隐藏） -->
    <div id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-new-chat" onclick="App.createNewChat()">
          <span class="sidebar-new-chat-icon">＋</span>
          <span>新建对话</span>
        </div>
      </div>
      <div class="sidebar-mid">
        <div class="sidebar-section-label">历史对话</div>
        <div id="sidebar-history-list" class="sidebar-history-list"></div>
      </div>
      <div class="sidebar-bottom">
        <div id="sidebar-user" class="sidebar-user" onclick="App.navigate('profile')">
          <div class="sidebar-user-avatar">👤</div>
          <div class="sidebar-user-name">登录/注册</div>
        </div>
      </div>
    </div>

    <!-- 主内容区 -->
    <div id="main-area" class="main-area">
      <!-- 导航栏（移动端显示，桌面端隐藏） -->
      <div id="navbar" class="navbar"></div>

      <!-- 页面内容区 -->
      <div id="page-container" class="page-container"></div>

      <!-- 底部 TabBar（移动端显示，桌面端隐藏） -->
      <div id="tabbar" class="tabbar">
        <div class="tabbar-indicator" id="tabbar-indicator"></div>
        <div class="tabbar-items" id="tabbar-items">
          <div class="tabbar-item" data-route="home" data-icon="💬" data-label="对话"></div>
          <div class="tabbar-item" data-route="create" data-icon="✨" data-label="创作"></div>
          <div class="tabbar-item" data-route="history" data-icon="🖼️" data-label="历史"></div>
          <div class="tabbar-item" data-route="profile" data-icon="👤" data-label="我的"></div>
        </div>
      </div>
    </div>

    <!-- 全局遮罩层（弹窗用） -->
    <div id="overlay" class="overlay hidden"></div>

    <!-- Toast 容器 -->
    <div id="toast" class="toast hidden"></div>

    <!-- Loading 容器 -->
    <div id="loading" class="loading hidden">
      <div class="loading-spinner"></div>
      <div class="loading-text" id="loading-text">加载中...</div>
    </div>

    <!-- ActionSheet -->
    <div id="action-sheet" class="action-sheet hidden">
      <div class="action-sheet-content">
        <div class="action-sheet-title" id="action-sheet-title">选择操作</div>
        <div id="action-sheet-items"></div>
        <div class="action-sheet-cancel" id="action-sheet-cancel">取消</div>
      </div>
    </div>

    <!-- Modal 弹窗 -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-title" id="modal-title">提示</div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-actions">
          <div class="modal-btn modal-cancel" id="modal-cancel">取消</div>
          <div class="modal-btn modal-confirm" id="modal-confirm">确定</div>
        </div>
      </div>
    </div>

    <!-- 图片预览 -->
    <div id="image-preview" class="image-preview hidden">
      <div class="image-preview-close" id="image-preview-close">×</div>
      <img id="image-preview-img" class="image-preview-img" src="" alt="">
    </div>
  </div>

  <!-- 应用脚本 -->
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/chat.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/history.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
